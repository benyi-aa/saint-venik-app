# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "Color & Size Picker"
handle = "saint-venik"
application_url = "https://diegogardilcic.github.io/saint-venik-app/admin/"
embedded = true
client_id = "feb92266442449d38f005beb90710f05"

[access.admin]
# El panel habla con la Admin API desde el navegador, autenticado con la sesion
# del usuario que lo esta mirando. Sin esto haria falta un servidor.
direct_api_mode = "online"
embedded_app_direct_api_access = true

[access_scopes]
# Los bloques del storefront no necesitan ninguno: leen con Liquid. Estos son
# para el panel, que escribe metaobjetos (colores y guias), metacampos de
# producto (el hermano de color) y sube archivos (imagenes y PDF).
# Las definiciones son un permiso aparte de las entradas: write_metaobjects deja
# editar un color, pero no leer ni crear el tipo de metaobjeto en si.
scopes = "write_products, write_metaobjects, write_metaobject_definitions, write_files"
# Instalacion gestionada por Shopify. No ponemos use_legacy_install_flow = true:
# ese modo usa el OAuth antiguo y necesita un servidor que atienda el callback,
# que es justo lo que esta app no tiene.
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://diegogardilcic.github.io/saint-venik-app/admin/" ]

[webhooks]
api_version = "2026-10"

[build]
automatically_update_urls_on_dev = true
