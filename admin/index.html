<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Color &amp; Size Picker · Saint Venik</title>
    <!-- Un panel, dos apps. saintvenik.com y saintvenik.cl usan la misma app, pero
         registrada dos veces: Shopify no deja instalar una app personalizada en
         dos tiendas que no esten en la misma organizacion Plus. Cada registro
         tiene su client id, y App Bridge necesita el de la tienda que abre el
         panel. Shopify pasa esa tienda en ?shop=, asi que se elige aqui, antes
         de cargar App Bridge, que lo lee de <meta name="shopify-api-key">.
         Los client id son publicos. -->
    <script>
      (function () {
        var CLAVES = {
          'vd9tn0-et.myshopify.com': 'feb92266442449d38f005beb90710f05',   // saintvenik.com
          'saint-venik.myshopify.com': '84461ac8cf7dfba116de1681402b6371'  // saintvenik.cl
        };
        var q = new URLSearchParams(location.search);
        var tienda = q.get('shop') || '';
        if (!tienda && q.get('host')) {
          try {
            var m = atob(q.get('host')).match(/\/store\/([^/?]+)/);
            if (m) tienda = m[1] + '.myshopify.com';
          } catch (e) { /* host ilegible: se usa la de .com */ }
        }
        var meta = document.createElement('meta');
        meta.name = 'shopify-api-key';
        meta.content = CLAVES[tienda] || CLAVES['vd9tn0-et.myshopify.com'];
        document.head.appendChild(meta);
      })();
    </script>
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>

    <!-- Las URLs se calculan aquí, al cargar, y no se escriben en el archivo.
         GitHub Pages sirve este index con cache-control: max-age=600, así que un
         index con URLs fijas puede seguir apuntando diez minutos a los archivos
         viejos por muy sellados que estén. Con un sello por minuto calculado en
         el navegador, un index cacheado igual pide los archivos nuevos. -->
    <script>
      (function () {
        var v = new URLSearchParams(location.search).get('v')
          || String(Math.floor(Date.now() / 60000));
        window.__SV_V = v;

        [
          './app.css',
          '../extensions/saint-venik/assets/sv-color-selector.css',
          '../extensions/saint-venik/assets/sv-size-guide.css',
        ].forEach(function (href) {
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = href + '?v=' + v;
          document.head.appendChild(l);
        });
      })();
    </script>
  </head>
  <body>
    <header class="cabecera">
      <img class="cabecera__logo" src="./logo.svg" alt="Saint Venik" width="600" height="462" />
      <span class="cabecera__nombre">Color &amp; Size Picker</span>
    </header>

    <nav class="nav">
      <button class="nav__item is-active" data-pantalla="colores">Colores</button>
      <button class="nav__item" data-pantalla="productos">Productos</button>
      <button class="nav__item" data-pantalla="guias">Guías de tallas</button>
      <button class="nav__item" data-pantalla="apariencia">Apariencia</button>
    </nav>

    <div id="aviso" class="aviso" hidden></div>

    <main id="pantalla" class="pantalla">
      <p class="cargando">Cargando…</p>
    </main>

    <p class="version" id="version"></p>

    <script type="module">
      import('./app.js?v=' + window.__SV_V);
    </script>
  </body>
</html>
